<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-arch-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <style>
    .node-title-l { font-family: system-ui, sans-serif; font-weight: 800; font-size: 13px; fill: #0f172a; }
    .node-sub-l { font-family: system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #64748b; }
    .badge-sub-l { font-family: system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #2563eb; }
  </style>

  <rect width="960" height="480" rx="16" fill="url(#bg-arch-light)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 1. Developer Layer -->
  <g transform="translate(30, 30)">
    <rect width="180" height="85" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="16" y="28" class="node-title-l">💻 Developer Layer</text>
    <text x="16" y="46" class="node-sub-l">Workstation (git push / PR)</text>
    <rect x="16" y="56" width="90" height="18" rx="4" fill="#eff6ff" />
    <text x="24" y="69" class="badge-sub-l">main / dev branch</text>
  </g>

  <!-- 2. GitHub Actions CI/CD Layer -->
  <g transform="translate(240, 30)">
    <rect width="690" height="85" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
    <text x="16" y="26" class="node-title-l">⚙️ CI/CD Execution Layer (GitHub Actions Runner)</text>
    
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="75" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1" />
      <text x="37" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca" text-anchor="middle">Checkout</text>

      <rect x="85" y="0" width="130" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" />
      <text x="150" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#be123c" text-anchor="middle">Gitleaks + Semgrep</text>

      <rect x="225" y="0" width="95" height="32" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1" />
      <text x="272" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3730a3" text-anchor="middle">Docker Build</text>

      <rect x="330" y="0" width="90" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
      <text x="375" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Trivy CVE</text>

      <rect x="430" y="0" width="95" height="32" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1" />
      <text x="477" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Policy Gate</text>

      <rect x="535" y="0" width="120" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
      <text x="595" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Cloud Run Deploy</text>
    </g>
  </g>

  <!-- 3. Cloud Backend Layer -->
  <g transform="translate(30, 150)">
    <rect width="430" height="180" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="20" y="28" class="node-title-l">⚡ Cloud Backend Layer (GCP Cloud Run)</text>
    
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="185" height="55" rx="6" fill="#f8fafc" stroke="#0284c7" />
      <text x="12" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0369a1">FastAPI Monolith Gateway</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#64748b">REST API • WebSockets • Telemetry</text>

      <rect x="205" y="0" width="185" height="55" rx="6" fill="#f8fafc" stroke="#059669" />
      <text x="217" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#047857">PostgreSQL Cloud SQL</text>
      <text x="217" y="38" font-family="sans-serif" font-size="10" fill="#64748b">12+ Schema Tables (SQLAlchemy)</text>

      <rect x="0" y="68" width="185" height="55" rx="6" fill="#f8fafc" stroke="#e11d48" />
      <text x="12" y="88" font-family="sans-serif" font-weight="bold" font-size="11" fill="#be123c">Redis Memorystore</text>
      <text x="12" y="104" font-family="sans-serif" font-size="10" fill="#64748b">Pub/Sub + Celery Queue</text>

      <rect x="205" y="68" width="185" height="55" rx="6" fill="#f8fafc" stroke="#d97706" />
      <text x="217" y="88" font-family="sans-serif" font-weight="bold" font-size="11" fill="#b45309">Policy Evaluator</text>
      <text x="217" y="104" font-family="sans-serif" font-size="10" fill="#64748b">policy.yaml CVSS Gate Rules</text>
    </g>
  </g>

  <!-- 4. Air-Gapped Local GPU Void AI Layer -->
  <g transform="translate(490, 150)">
    <rect width="440" height="180" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="20" y="28" class="node-title-l">🧠 Air-Gapped Void AI Server (Local GPU Machine B)</text>
    
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="195" height="55" rx="6" fill="#f8fafc" stroke="#7c3aed" />
      <text x="12" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#6d28d9">FastAPI AI Gateway (:8100)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#64748b">JWT Auth + Secret Redactor</text>

      <rect x="210" y="0" width="190" height="55" rx="6" fill="#f8fafc" stroke="#0891b2" />
      <text x="222" y="22" font-family="sans-serif" font-weight="bold" font-size="11" fill="#0e7490">ChromaDB RAG Store</text>
      <text x="222" y="38" font-family="sans-serif" font-size="10" fill="#64748b">nomic-embed-text Embeddings</text>

      <rect x="0" y="68" width="400" height="55" rx="6" fill="#f8fafc" stroke="#a855f7" />
      <text x="12" y="88" font-family="sans-serif" font-weight="bold" font-size="11" fill="#7e22ce">Ollama LLM Host (Qwen2.5 3B / DeepSeek 6.7B)</text>
      <text x="12" y="104" font-family="sans-serif" font-size="10" fill="#64748b">Security Reasoning • 1-Click Code Patching • 590-Line Fallback</text>
    </g>
  </g>

  <!-- 5. Distributed DAST Worker Layer -->
  <g transform="translate(30, 360)">
    <rect width="430" height="90" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="20" y="26" class="node-title-l">🖥️ Distributed DAST Worker Layer (GCP VM)</text>
    <text x="20" y="44" class="node-sub-l">Celery Task Consumer → OWASP ZAP Baseline Scanner (Docker)</text>
    <rect x="20" y="56" width="230" height="20" rx="4" fill="#fff7ed" />
    <text x="28" y="70" class="badge-sub-l" fill="#c2410c">Asynchronous Staging Endpoint Scan</text>
  </g>

  <!-- 6. Client Interface Layer -->
  <g transform="translate(490, 360)">
    <rect width="440" height="90" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    <text x="20" y="26" class="node-title-l">🎨 Client Interface Layer (React 19 Executive Dashboard)</text>
    <text x="20" y="44" class="node-sub-l">TanStack Query • Zustand • Recharts • Framer Motion • Void AI Drawer</text>
    <rect x="20" y="56" width="200" height="20" rx="4" fill="#ecfdf5" />
    <text x="28" y="70" class="badge-sub-l" fill="#047857">Sub-15ms Live WebSocket Stream</text>
  </g>

  <!-- Flow Paths with SMIL Animations -->
  <path d="M 210 72 L 240 72" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" />
  </path>

  <path d="M 330 115 L 330 150" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" />
  </path>

  <path d="M 460 240 L 490 240" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite" />
  </path>
</svg>
