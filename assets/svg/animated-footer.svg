<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="100%" height="100%">
  <defs>
    <linearGradient id="ftr-l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="ftr-line-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <style>
    .ftr-t-l { font-family: system-ui, sans-serif; font-weight: 800; font-size: 17px; fill: #0f172a; }
    .ftr-s-l { font-family: system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #64748b; }
  </style>

  <rect width="960" height="110" rx="14" fill="url(#ftr-l-bg)" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 0 0 L 960 0" stroke="url(#ftr-line-l)" stroke-width="3" />

  <g transform="translate(40, 30)">
    <text x="0" y="20" class="ftr-t-l">Secure<tspan fill="#2563eb">Flow</tspan></text>
    <text x="0" y="40" class="ftr-s-l">Automated DevSecOps Platform &amp; Local GPU Void AI Engine</text>

    <g transform="translate(400, 8)">
      <rect width="240" height="34" rx="17" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1" />
      <circle cx="20" cy="17" r="4" fill="#059669">
        <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" font-family="sans-serif" font-weight="bold" font-size="11" fill="#047857">All Security Systems Operational</text>
    </g>

    <g transform="translate(720, 10)">
      <rect width="160" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="80" y="18" font-family="sans-serif" font-weight="bold" font-size="11" fill="#334155" text-anchor="middle">MIT License • v2.0.0</text>
      <text x="80" y="42" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Built by <tspan fill="#2563eb" font-weight="bold">Abhimanyu Kumar</tspan></text>
    </g>
  </g>
</svg>
