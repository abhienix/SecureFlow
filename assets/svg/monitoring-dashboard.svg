<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="100%" height="100%">
  <defs>
    <linearGradient id="mon-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="spark-blue-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mon-t-l { font-family: system-ui, sans-serif; font-weight: 800; font-size: 14px; fill: #0f172a; }
    .card-l-l { font-family: system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-v-l { font-family: system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .card-u-l { font-family: system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #64748b; }
  </style>

  <rect width="840" height="270" rx="14" fill="url(#mon-light-bg)" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="30" y="32" class="mon-t-l">📊 Observability, Prometheus Metrics &amp; Real-Time Alerting</text>

  <!-- Metric Card 1 -->
  <g transform="translate(30, 48)">
    <rect width="240" height="95" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
    <text x="16" y="24" class="card-l-l">API Throughput</text>
    <text x="16" y="50" class="card-v-l" fill="#0284c7">1,420 <tspan class="card-u-l">req/sec</tspan></text>
    <path d="M 16 80 Q 50 60 90 70 T 160 50 T 224 65 L 224 85 L 16 85 Z" fill="url(#spark-blue-l)" />
    <path d="M 16 80 Q 50 60 90 70 T 160 50 T 224 65" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="200">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Metric Card 2 -->
  <g transform="translate(290, 48)">
    <rect width="240" height="95" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1" />
    <text x="16" y="24" class="card-l-l">DAST Queue Depth</text>
    <text x="16" y="50" class="card-v-l" fill="#6d28d9">0 <tspan class="card-u-l">pending</tspan></text>
    <path d="M 16 80 Q 50 75 90 55 T 160 65 T 224 50 L 224 85 L 16 85 Z" fill="url(#spark-blue-l)" />
    <path d="M 16 80 Q 50 75 90 55 T 160 65 T 224 50" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="200">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Metric Card 3 -->
  <g transform="translate(550, 48)">
    <rect width="260" height="95" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1" />
    <text x="16" y="24" class="card-l-l">Worker CPU / RAM</text>
    <text x="16" y="50" class="card-v-l" fill="#047857">18.4% <tspan class="card-u-l">CPU</tspan> • 2.1 <tspan class="card-u-l">GB RAM</tspan></text>
    <rect x="16" y="64" width="228" height="6" rx="3" fill="#f1f5f9" />
    <rect x="16" y="64" width="42" height="6" rx="3" fill="#059669" />
    <rect x="16" y="76" width="228" height="6" rx="3" fill="#f1f5f9" />
    <rect x="16" y="76" width="115" height="6" rx="3" fill="#2563eb" />
  </g>

  <!-- Slack Alert Card -->
  <g transform="translate(30, 160)">
    <rect width="780" height="85" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
    <g transform="translate(20, 18)">
      <rect x="0" y="0" width="4" height="48" rx="2" fill="#e11d48" />
      <g transform="translate(16, 0)">
        <text x="0" y="14" font-family="sans-serif" font-weight="bold" font-size="12" fill="#be123c">🚨 SLACK ALERT DISPATCHED — #devsecops-alerts</text>
        <text x="0" y="30" font-family="sans-serif" font-size="11" fill="#334155">Target: <tspan fill="#0f172a" font-weight="bold">abhienix/SecureFlow:main</tspan> • Commit: <tspan fill="#2563eb">e1638fa</tspan> • Decision: <tspan fill="#be123c" font-weight="bold">BLOCK</tspan></text>
        <text x="0" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Reason: Exposed secret detected by Gitleaks (Rule: github-pat in backend/config.py:42)</text>
      </g>
      <g transform="translate(630, 10)">
        <rect width="105" height="26" rx="5" fill="#e11d48" />
        <text x="52" y="17" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">View Audit Log</text>
      </g>
    </g>
  </g>
</svg>
