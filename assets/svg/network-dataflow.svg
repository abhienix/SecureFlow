<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <linearGradient id="df-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <style>
    .df-t-l { font-family: system-ui, sans-serif; font-weight: 800; font-size: 14px; fill: #0f172a; }
    .node-t-l { font-family: system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; text-anchor: middle; }
    .node-s-l { font-family: system-ui, sans-serif; font-weight: 400; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .path-lbl-l { font-family: system-ui, sans-serif; font-weight: 600; font-size: 10px; fill: #2563eb; text-anchor: middle; }
  </style>

  <rect width="900" height="340" rx="14" fill="url(#df-light-bg)" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="30" y="32" class="df-t-l">🌐 Network &amp; Telemetry Data-Flow Topology</text>

  <!-- Network Nodes -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
    <text x="0" y="-5" class="node-t-l">GHA Runner</text>
    <text x="0" y="10" class="node-s-l">Security CI</text>
  </g>

  <g transform="translate(450, 100)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <text x="0" y="-8" class="node-t-l">FastAPI Gateway</text>
    <text x="0" y="8" class="node-s-l">Cloud Run</text>
    <text x="0" y="22" font-family="sans-serif" font-size="9" fill="#0284c7" font-weight="bold" text-anchor="middle">Monolith :8000</text>
  </g>

  <g transform="translate(450, 260)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
    <text x="0" y="-5" class="node-t-l">Redis Broker</text>
    <text x="0" y="10" class="node-s-l">Pub/Sub &amp; Queue</text>
  </g>

  <g transform="translate(180, 260)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <text x="0" y="-5" class="node-t-l">DAST Worker</text>
    <text x="0" y="10" class="node-s-l">ZAP Container</text>
  </g>

  <g transform="translate(760, 100)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" />
    <text x="0" y="-8" class="node-t-l">Void AI Server</text>
    <text x="0" y="8" class="node-s-l">Ollama + RAG</text>
    <text x="0" y="22" font-family="sans-serif" font-size="9" fill="#6d28d9" font-weight="bold" text-anchor="middle">Air-Gapped GPU</text>
  </g>

  <g transform="translate(760, 260)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="0" y="-5" class="node-t-l">React UI</text>
    <text x="0" y="10" class="node-s-l">Client Browser</text>
  </g>

  <!-- Flow Paths with SMIL Animations -->
  <path d="M 136 100 L 404 100" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite" />
  </path>
  <rect x="230" y="82" width="95" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="277" y="94" class="path-lbl-l" fill="#4338ca">HTTP Progress</text>

  <path d="M 450 146 L 450 220" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite" />
  </path>
  <rect x="458" y="172" width="85" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="500" y="184" class="path-lbl-l" fill="#be123c">Task Enqueue</text>

  <path d="M 410 260 L 216 260" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite" />
  </path>
  <rect x="270" y="242" width="80" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="310" y="254" class="path-lbl-l" fill="#c2410c">Celery Poll</text>

  <path d="M 494 100 L 716 100" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite" />
  </path>
  <rect x="565" y="82" width="85" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="607" y="94" class="path-lbl-l" fill="#6d28d9">RAG Query</text>

  <path d="M 490 260 L 720 260" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite" />
  </path>
  <rect x="555" y="242" width="105" height="18" rx="4" fill="#f1f5f9" stroke="#a7f3d0" />
  <text x="607" y="254" class="path-lbl-l" fill="#047857">WS Push &lt; 15ms</text>
</svg>
