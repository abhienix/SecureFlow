name: SecureFlow Security Pipeline

on:
  push:
    branches: [ main, dev, secureflow-v1 ]
  pull_request:
    branches: [ main, secureflow-v1 ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Force deploy backend to Cloud Run"
        type: boolean
        default: false
      deploy_frontend:
        description: "Force deploy frontend to Cloud Run"
        type: boolean
        default: false

# ── FIX A: Concurrency control ────────────────────────────────────────────
# THE BUG: with no concurrency group, pushing several commits close together
# (as happened with the 9 stuck runs — several landing within the same
# hour) can cause GitHub Actions to queue or, on some runner configs,
# cancel an in-progress run on the same branch when a newer commit arrives.
# A cancelled run never reaches Step 5 ("Notify Code Scan Progress"), so the
# dashboard row created in Step 1 is left at status="running" forever.
#
# THE FIX: group by branch and let new pushes cancel the *stale* run instead
# of letting GitHub kill it ambiguously mid-job. This alone doesn't close
# the dashboard row, so it's paired with Fix C (the always()-gated final
# notifier) which explicitly reports "cancelled/superseded" back to the
# backend so the row never sits at "running" indefinitely.
concurrency:
  group: secureflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-pipeline:
    name: Full Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ── Step 0: Checkout ────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4 # nosemgrep
        with:
          # fetch-depth: 0 fetches the full git history, not just the latest commit.
          # This is required for Gitleaks to scan all commits, not just HEAD —
          # without it, secrets committed earlier and then "deleted" would go undetected
          fetch-depth: 0

      # ── Step 1: Notify dashboard — pipeline started ─────────────────────────
      # Creates a "running" DB record immediately so the dashboard shows
      # the pipeline in progress before any scan results arrive.
      # The run_id returned here is passed to every subsequent step so they
      # all update the same record instead of creating duplicates.
      - name: Notify Pipeline Start
        id: pipeline_start
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            '{ repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg, scan_type: $scan_type }')

          RESPONSE=$(curl -sS -f -X POST "$BACKEND_URL/api/scan-results/start" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo '{"run_id":null}')

          echo "Backend response: $RESPONSE"
          RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          if [ -n "$RUN_ID" ]; then
            curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d '{ "pipeline_steps": { "checkout": { "result": "PASS", "detail": "code checked out" } } }' || true
            # Immediately mark code_scan as RUNNING — real-time visibility
            curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d '{ "pipeline_steps": { "code_scan": { "result": "RUNNING", "detail": "scanning code with Gitleaks + Semgrep..." } } }' || true
          fi

      # ── Step 2: Install Gitleaks ────────────────────────────────────────────
      # Pin to a specific version (v8.24.3) rather than "latest" so the pipeline
      # doesn't break silently when a new Gitleaks release changes CLI flags or output format
      #
      # ── FIX B: continue-on-error + retry on the install step ────────────────
      # THE BUG: this step had NO continue-on-error and NO retry logic. A
      # transient network blip or rate-limit (HTTP 429/5xx) on
      # github.com/gitleaks/gitleaks/releases/... — which is exactly the kind
      # of thing that happens when several CI runs hit GitHub's release CDN
      # within the same hour — failed the job immediately, before Step 5 ever
      # ran. The dashboard row from Step 1 was then never updated again.
      # This matches the stuck runs exactly: every one of them shows
      # "Checkout: pending" — meaning the job died before Step 5 could even
      # report checkout as PASS.
      #
      # THE FIX: retry the download up to 3 times with backoff, and mark the
      # step itself as continue-on-error so that even a final failure lets
      # the workflow reach Step 2a below, which reports the failure to the
      # dashboard instead of leaving the row stuck.
      - name: Install Gitleaks
        id: gitleaks_install
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if curl -sSL --fail --retry 2 --retry-delay 3 \
                 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
                 -o gitleaks.tar.gz; then
              break
            fi
            echo "Gitleaks download attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
            if [ "$attempt" = "3" ]; then
              echo "Gitleaks download failed after 3 attempts"
              exit 1
            fi
          done
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ── Step 2a: Notify dashboard if Gitleaks itself failed to install ──────
      # NEW STEP. Without this, an install failure (now caught by
      # continue-on-error above) would otherwise just fall through into
      # Step 3 (Run Gitleaks), which would also fail since the binary
      # doesn't exist — but with no explicit reporting either way, the
      # dashboard row stays at "running" forever. This closes that gap
      # immediately rather than waiting for the watchdog timeout.
      - name: Notify Gitleaks Install Failure
        if: steps.gitleaks_install.outcome == 'failure' && steps.pipeline_start.outputs.run_id != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --arg severity "UNKNOWN" \
            --arg action "BLOCK" \
            --arg reason "Gitleaks failed to download/install (infra issue, not a security finding)" \
            --argjson run_id "\"${RUN_ID}\"" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, severity: $severity, action: $action, reason: $reason,
              run_id: $run_id, findings: {},
              pipeline_steps: {
                checkout:       { result: "PASS",   detail: "code checked out" },
                code_scan:      { result: "FAILED", detail: "gitleaks install failed after 3 retries — infra/network issue" },
                docker:         { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                trivy:          { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                policy:         { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                deploy_staging: { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                zap:            { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                zap_gate:       { result: "SKIPPED", detail: "pipeline stopped at code scan failure" },
                deploy_prod:    { result: "SKIPPED", detail: "pipeline stopped at code scan failure" }
              }
            }')
          curl -sS -X POST "$BACKEND_URL/api/scan-results" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" -d "$PAYLOAD" || true
          exit 1

      # ── Step 3: Run Gitleaks ────────────────────────────────────────────────
      # Scan ONLY commits in this push — not full history. With fetch-depth: 0
      # a full-history scan re-detects secrets in old commits forever and blocks
      # every deploy even when the current commit is clean.
      - name: Run Gitleaks
        id: gitleaks
        if: steps.gitleaks_install.outcome == 'success'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            LOG_OPTS="-n 1"
            echo "First push or unknown before-SHA — scanning latest commit only"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="-n 1"
            echo "BEFORE_SHA ($BEFORE_SHA) not found (force-push) — scanning latest commit only"
          else
            LOG_OPTS="${BEFORE_SHA}..${AFTER_SHA}"
            echo "Scanning commits in push: $LOG_OPTS"
          fi

          gitleaks detect \
            --source . \
            --log-opts="$LOG_OPTS" \
            --redact \
            -v \
            --exit-code=1 \
            --report-format=json \
            --report-path=gitleaks-results.json || GITLEAKS_FAILED=true

          if [ "$GITLEAKS_FAILED" = "true" ]; then
            echo "Gitleaks found secrets in this push!"
            echo "--- gitleaks results ---"
            cat gitleaks-results.json 2>/dev/null || echo "no results file"
            exit 1
          fi
          echo "Gitleaks passed — no secrets in commits being pushed"

      # ── Step 4: Run Semgrep ─────────────────────────────────────────────────
      - name: Install and Run Semgrep
        id: semgrep
        if: steps.gitleaks_install.outcome == 'success'
        continue-on-error: true
        run: |
          pip install semgrep --break-system-packages 2>/dev/null || pip install semgrep

          semgrep scan \
            --config "p/python" \
            --config "p/secrets" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --json \
            --output semgrep-results.json \
            --error \
            . || SEMGREP_FAILED=true

          if [ "$SEMGREP_FAILED" = "true" ]; then
            FINDING_COUNT=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo "unknown")
            echo "Semgrep found $FINDING_COUNT issues"
            cat semgrep-results.json
            exit 1
          fi

      # ── Step 5: (removed — policy gate & deploy steps report code_scan result) ─

      # ── Step 6: Block on code scan failure ──────────────────────────────────
      - name: Block on Code Scan Failure
        if: steps.gitleaks.outcome == 'failure' || steps.semgrep.outcome == 'failure'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep.outcome }}
        run: |
          set -euo pipefail
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | tr -d '\0')

          if [ "$GITLEAKS_RESULT" = "failure" ]; then
            REASON="Secret or credential found in code (Gitleaks)"
            GITLEAKS_DETAIL=$(jq -r '
              if type == "array" and length > 0 then
                .[0] | "Rule: \(.RuleID // .RuleId // "secret") | File: \(.File // .file // "?"):\(.StartLine // .startLine // "?")"
              elif type == "object" then
                "Rule: \(.RuleID // .RuleId // "secret") | File: \(.File // .file // "?"):\(.StartLine // .startLine // "?")"
              else
                "secret detected — check gitleaks output above"
              end
            ' gitleaks-results.json 2>/dev/null || echo "gitleaks=failure — see logs above")
            DETAIL="$GITLEAKS_DETAIL"
          else
            REASON="Insecure code pattern detected (Semgrep)"
            SEMGREP_DETAIL=$(jq -r '
              if (.results | length) > 0 then
                .results[0] |
                "Rule: \(.check_id | split(".") | last) | File: \(.path):\(.start.line) | \(.extra.message)"
              else
                "semgrep=failure — see logs above"
              end
            ' semgrep-results.json 2>/dev/null || echo "semgrep=failure — see logs above")
            DETAIL="$SEMGREP_DETAIL"
          fi

          if [ -n "${RUN_ID:-}" ] && [ "$RUN_ID" != "null" ]; then
            RUN_ID_ARG="$RUN_ID"
          else
            RUN_ID_ARG=""
          fi

          if [ "$GITLEAKS_RESULT" = "failure" ] && [ -f gitleaks-results.json ]; then
            GITLEAKS_JSON=$(jq -c 'if type == "array" then . elif . == null then [] else [.] end | map(select(type == "object"))' gitleaks-results.json 2>/dev/null || echo '[]')
          else
            GITLEAKS_JSON='[]'
          fi

          if [ "$SEMGREP_RESULT" = "failure" ] && [ -f semgrep-results.json ]; then
            SEMGREP_JSON=$(jq -c '.results // []' semgrep-results.json 2>/dev/null || echo '[]')
          else
            SEMGREP_JSON='[]'
          fi

          jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg scan_type "full-pipeline" \
            --arg severity "HIGH" \
            --arg action "BLOCK" \
            --arg reason "$REASON" \
            --arg run_id "$RUN_ID_ARG" \
            --arg code_detail "$DETAIL" \
            --argjson gitleaks "$GITLEAKS_JSON" \
            --argjson semgrep "$SEMGREP_JSON" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, severity: $severity, action: $action, reason: $reason,
              run_id: (if $run_id == "" then null else ($run_id | tonumber) end),
              gitleaks: $gitleaks,
              semgrep: $semgrep,
              findings: {},
              pipeline_steps: {
                checkout:       { result: "PASS",    detail: "code checked out" },
                code_scan:      { result: "BLOCK",   detail: $code_detail },
                docker:         { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                trivy:          { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                policy:         { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                deploy_staging: { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                zap:            { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                zap_gate:       { result: "SKIPPED", detail: "pipeline stopped at code scan" },
                deploy_prod:    { result: "SKIPPED", detail: "pipeline stopped at code scan" }
              }
            }' > block-payload.json

          echo "Notifying backend of BLOCK..."
          RESPONSE=$(curl -sS -f -X POST "$BACKEND_URL/api/scan-results" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d @block-payload.json) || RESPONSE='{"action":"BLOCK"}'

          echo "Backend response: $RESPONSE"
          BACKEND_ACTION=$(echo "$RESPONSE" | jq -r '.action // "BLOCK"')
          if [ "$BACKEND_ACTION" != "BLOCK" ]; then
            echo "::warning::Backend returned action=$BACKEND_ACTION — deploy blocked anyway (code scan failed)"
          fi

          echo "::error::Pipeline blocked — $REASON. Fix the finding or rotate the exposed secret."
          exit 1

      # ── Step 7: Check if image needs rebuilding ─────────────────────────────
      # Uses the FULL PUSH diff (before..after), not just HEAD~1. Otherwise a
      # CI-only commit after frontend/backend changes skips deploy entirely.
      - name: Check if image needs rebuilding
        id: changes
        if: steps.gitleaks.outcome != 'failure' && steps.semgrep.outcome != 'failure'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_BACKEND: ${{ github.event.inputs.deploy_backend }}
          FORCE_FRONTEND: ${{ github.event.inputs.deploy_frontend }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD)
            else
              CHANGED=$(git show --name-only --pretty="" HEAD)
            fi
            echo "First push, unknown, or force-pushed before-SHA — using latest commit diff"
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
            echo "Push diff: $BEFORE_SHA..$AFTER_SHA"
          fi

          echo "Changed files in scope:"
          echo "$CHANGED"

          DEPLOY_ALL=false
          DEPLOY_BACKEND_ONLY=false
          DEPLOY_FRONTEND_ONLY=false

          if printf '%s' "$COMMIT_MESSAGE" | grep -qE '\[deploy:all\]|\[deploy\]'; then
            DEPLOY_ALL=true
            echo "Commit message contains [deploy] or [deploy:all] — forcing backend + frontend deploy"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[deploy:backend]'; then
            DEPLOY_BACKEND_ONLY=true
            echo "Commit message contains [deploy:backend] — forcing backend deploy"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[deploy:frontend]'; then
            DEPLOY_FRONTEND_ONLY=true
            echo "Commit message contains [deploy:frontend] — forcing frontend deploy"
          fi

          if [ "$FORCE_BACKEND" = "true" ] || [ "$DEPLOY_ALL" = "true" ] || [ "$DEPLOY_BACKEND_ONLY" = "true" ]; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
            echo "Force override active: backend deploy enabled"
          elif echo "$CHANGED" | grep -qE '(^|/)backend/|(^|/)docker/|policy\.yaml|requirements.*\.txt|Dockerfile'; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend/docker files changed — full image scan required"
          else
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend/docker files in push — skipping backend image scan"
          fi

          if [ "$FORCE_FRONTEND" = "true" ] || [ "$DEPLOY_ALL" = "true" ] || [ "$DEPLOY_FRONTEND_ONLY" = "true" ]; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            echo "Force override active: frontend deploy enabled"
          elif echo "$CHANGED" | grep -qE '(^|/)frontend/'; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            echo "Frontend files changed — frontend rebuild required"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
            echo "No frontend files in push — skipping frontend build"
          fi

      # ── Step 8: Report clean (no image changes) ─────────────────────────────
      - name: Report Clean (no image changes)
        if: |
          steps.changes.outputs.image_changed == 'false' &&
          steps.changes.outputs.frontend_changed == 'false' &&
          steps.gitleaks.outcome != 'failure' &&
          steps.semgrep.outcome != 'failure'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RUN_ID_VAL="${RUN_ID:-null}"
          if [ "$RUN_ID_VAL" != "null" ] && [ -n "$RUN_ID_VAL" ]; then
            RUN_ID_JSON="\"$RUN_ID_VAL\""
          else
            RUN_ID_JSON="null"
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --arg severity "CLEAN" \
            --arg action "ALLOW" \
            --arg reason "Code scan passed, no backend/docker files changed" \
            --argjson run_id "$RUN_ID_JSON" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, severity: $severity, action: $action, reason: $reason,
              run_id: $run_id, findings: {},
              pipeline_steps: {
                checkout:       { result: "PASS",    detail: "code checked out" },
                code_scan:      { result: "PASS",    detail: "no secrets or bad patterns found" },
                docker:         { result: "SKIPPED", detail: "no backend or docker files changed" },
                trivy:          { result: "SKIPPED", detail: "no backend or docker files changed" },
                policy:         { result: "PASS",    detail: "no image changes — auto allow" },
                deploy_staging: { result: "SKIPPED", detail: "no backend changes to deploy" },
                zap:            { result: "SKIPPED", detail: "no backend changes to deploy" },
                zap_gate:       { result: "SKIPPED", detail: "no backend changes to deploy" },
                deploy_prod:    { result: "SKIPPED", detail: "no backend changes to deploy" }
              }
            }')

          curl -sS -X POST "$BACKEND_URL/api/scan-results" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      # ── Step 9: GCP auth ────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (steps.changes.outputs.image_changed == 'true' || steps.changes.outputs.frontend_changed == 'true')
        uses: google-github-actions/auth@v2 # nosemgrep
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (steps.changes.outputs.image_changed == 'true' || steps.changes.outputs.frontend_changed == 'true')
        uses: google-github-actions/setup-gcloud@v2 # nosemgrep

      - name: Configure Docker for Artifact Registry
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (steps.changes.outputs.image_changed == 'true' || steps.changes.outputs.frontend_changed == 'true')
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ── Step 10: Build and push backend image ───────────────────────────────
      - name: Notify Docker Build Starting
        if: >
          steps.changes.outputs.image_changed == 'true' &&
          steps.pipeline_start.outputs.run_id != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "docker": { "result": "RUNNING", "detail": "building backend Docker image..." } } }' || true

      - name: Build Backend Image
        id: docker_build
        if: steps.changes.outputs.image_changed == 'true'
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }} \
            -f docker/Dockerfile .

      - name: Push Backend Image
        id: docker_push
        if: steps.changes.outputs.image_changed == 'true'
        run: |
          docker push us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }}

      # ── Step 10a: Notify dashboard on Docker build/push failure ─────────────
      - name: Notify Docker Build/Push Failure
        if: >
          failure() &&
          steps.changes.outputs.image_changed == 'true' &&
          steps.pipeline_start.outputs.run_id != '' &&
          (steps.docker_build.outcome == 'failure' || steps.docker_push.outcome == 'failure')
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_OUTCOME: ${{ steps.docker_build.outcome }}
          PUSH_OUTCOME: ${{ steps.docker_push.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            FAIL_DETAIL="docker build failed — check Dockerfile and requirements.txt for errors"
          else
            FAIL_DETAIL="docker push failed — check GCP credentials and Artifact Registry permissions"
          fi

          RUN_ID_VAL="${RUN_ID:-null}"
          if [ "$RUN_ID_VAL" != "null" ] && [ -n "$RUN_ID_VAL" ]; then
            RUN_ID_JSON="\"$RUN_ID_VAL\""
          else
            RUN_ID_JSON="null"
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --arg severity "HIGH" \
            --arg action "BLOCK" \
            --arg reason "Docker build/push failed" \
            --argjson run_id "$RUN_ID_JSON" \
            --arg fail_detail "$FAIL_DETAIL" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, severity: $severity, action: $action, reason: $reason,
              run_id: $run_id, findings: {},
              pipeline_steps: {
                checkout:       { result: "PASS",   detail: "code checked out" },
                code_scan:      { result: "PASS",   detail: "no secrets or bad patterns found" },
                docker:         { result: "FAILED", detail: $fail_detail },
                trivy:          { result: "SKIPPED", detail: "pipeline stopped at docker build/push" },
                policy:         { result: "SKIPPED", detail: "pipeline stopped at docker build/push" },
                deploy_staging: { result: "SKIPPED", detail: "pipeline stopped at docker build/push" },
                zap:            { result: "SKIPPED", detail: "pipeline stopped at docker build/push" },
                zap_gate:       { result: "SKIPPED", detail: "pipeline stopped at docker build/push" },
                deploy_prod:    { result: "SKIPPED", detail: "pipeline stopped at docker build/push" }
              }
            }')

          curl -sS -X POST "$BACKEND_URL/api/scan-results" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      - name: Notify Build Progress
        if: >
          steps.changes.outputs.image_changed == 'true' &&
          steps.pipeline_start.outputs.run_id != '' &&
          steps.docker_build.outcome == 'success' &&
          steps.docker_push.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "docker": { "result": "PASS", "detail": "image built and pushed" } } }' || true
          # Immediately mark next stage as RUNNING — real-time visibility
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "trivy": { "result": "RUNNING", "detail": "scanning container for CVEs..." } } }' || true

      # ── Step 11: Trivy scan ─────────────────────────────────────────────────
      - name: Run Trivy CVE Scan
        if: >
          steps.changes.outputs.image_changed == 'true' &&
          steps.docker_build.outcome == 'success' &&
          steps.docker_push.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.35.0 # nosemgrep
        with:
          image-ref: us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy Results
        if: >
          steps.changes.outputs.image_changed == 'true' &&
          steps.docker_build.outcome == 'success' &&
          steps.docker_push.outcome == 'success'
        uses: actions/upload-artifact@v4 # nosemgrep
        with:
          name: trivy-results
          path: trivy-results.json

      # ── Step 12: Policy gate ────────────────────────────────────────────────
      - name: Send to Dashboard and Check Policy Gate
        if: >
          steps.changes.outputs.image_changed == 'true' &&
          steps.docker_build.outcome == 'success' &&
          steps.docker_push.outcome == 'success'
        id: gate
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json 2>/dev/null || echo "0")
          echo "Vulnerabilities found: $VULN_COUNT"

          RUN_ID_VAL="${RUN_ID:-null}"
          if [ "$RUN_ID_VAL" != "null" ] && [ -n "$RUN_ID_VAL" ]; then
            RUN_ID_JSON="\"$RUN_ID_VAL\""
          else
            RUN_ID_JSON="null"
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --argjson vuln_count "$VULN_COUNT" \
            --argjson run_id "$RUN_ID_JSON" \
            --rawfile policy_raw policy.yaml \
            --slurpfile findings trivy-results.json \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, run_id: $run_id, status: "running", findings: $findings[0], policy_raw: $policy_raw,
              pipeline_steps: {
                checkout:       { result: "PASS",    detail: "code checked out" },
                code_scan:      { result: "PASS",    detail: "no secrets or bad patterns found" },
                docker:         { result: "PASS",    detail: "image built and pushed" },
                trivy:          { result: "SCANNED", detail: "\($vuln_count) vulnerabilities found" },
                policy:         { result: "RUNNING", detail: "evaluating policy rules..." },
                deploy_staging: { result: "PENDING", detail: "Awaiting policy gate decision..." },
                zap:            { result: "PENDING", detail: "Awaiting staging Cloud Run deployment..." },
                zap_gate:       { result: "PENDING", detail: "Awaiting OWASP ZAP results..." },
                deploy_prod:    { result: "WAITING", detail: "Awaiting ZAP gate pass..." }
              }
            }')

          # --- Retry with exponential backoff ---
          RESP_FILE=$(mktemp)
          HTTP_CODE=000
          for attempt in 1 2 3; do
            echo "--- Policy gate attempt $attempt/3 ---"
            HTTP_CODE=$(echo "$PAYLOAD" | curl -sS -w "%{http_code}" -o "$RESP_FILE" -X POST "$BACKEND_URL/api/scan-results" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d @-)
            RC=$?
            echo "curl exit code: $RC, HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && [ "$RC" = "0" ]; then break; fi
            if [ $attempt -lt 3 ]; then
              SLEEP=$(( attempt * 5 ))
              echo "Retrying in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

          BODY=$(cat "$RESP_FILE")
          rm -f "$RESP_FILE"
          echo "Backend response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Backend unreachable (HTTP $HTTP_CODE) — allowing deployment with warning"
            echo "action=ALLOW" >> "$GITHUB_OUTPUT"
            curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d '{ "pipeline_steps": { "policy": { "result": "ALLOW", "detail": "policy gate soft-fail — backend unreachable" } } }' || true
            exit 0
          fi

          ACTION=$(echo "$BODY" | jq -r '.action // "BLOCK"')
          REASON=$(echo "$BODY" | jq -r '.reason // "policy engine rejected deployment"')
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

          if [ "$ACTION" = "BLOCK" ]; then
            echo "Policy gate says BLOCK — not deploying."
            curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d '{ "status": "complete", "pipeline_steps": { "policy": { "result": "BLOCK", "detail": "'"$REASON"'" } } }' || true
            exit 1
          else
            curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d '{ "pipeline_steps": { "policy": { "result": "PASS", "detail": "policy gate allowed deployment" } } }' || true
          fi

      # ── Step 13: Deploy to STAGING ─────────────────────────────────────────
      - name: Notify Staging Deploy
        if: steps.changes.outputs.image_changed == 'true' && steps.gate.outputs.action == 'ALLOW'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "running", "pipeline_steps": { "deploy_staging": { "result": "RUNNING", "detail": "Deploying backend to staging Cloud Run..." } } }' || true

      - name: Deploy Backend to Staging Cloud Run
        id: deploy_staging
        if: steps.changes.outputs.image_changed == 'true' && steps.gate.outputs.action == 'ALLOW'
        run: |
          gcloud run deploy secureflow-backend-staging \
            --image us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }} \
            --region us-central1 \
            --set-secrets="GROQ_API_KEY=GROQ_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --allow-unauthenticated

      - name: Get Staging URL
        id: staging_url
        if: steps.deploy_staging.outcome == 'success'
        run: |
          STAGING_URL=$(gcloud run services describe secureflow-backend-staging \
            --region us-central1 \
            --format 'value(status.url)')
          echo "staging_url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"
          sleep 30
          sleep 30

      - name: Notify Staging Deploy Success
        if: steps.deploy_staging.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "deploy_staging": { "result": "PASS", "detail": "Backend deployed to staging Cloud Run" } } }' || true

      - name: Notify Staging Deploy Failure
        if: failure() && steps.changes.outputs.image_changed == 'true' && steps.gate.outputs.action == 'ALLOW'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "complete", "pipeline_steps": { "deploy_staging": { "result": "FAILED", "detail": "Staging deploy failed" } } }' || true

      # ── Step 14: Build and push frontend image ──────────────────────────────
      - name: Build and Push Frontend
        if: >
          steps.changes.outputs.frontend_changed == 'true' &&
          (steps.changes.outputs.image_changed == 'false' || steps.gate.outputs.action == 'ALLOW')
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/frontend:${{ github.sha }} \
            --build-arg REACT_APP_API_URL=${{ secrets.BACKEND_URL }} \
            -f frontend/Dockerfile frontend/
          docker push us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/frontend:${{ github.sha }}

      # ── Step 15: Deploy frontend to staging ─────────────────────────────────
      - name: Notify Deploying Frontend to Staging
        if: >
          steps.changes.outputs.frontend_changed == 'true' &&
          (steps.changes.outputs.image_changed == 'false' || steps.gate.outputs.action == 'ALLOW')
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "deploy_staging": { "result": "RUNNING", "detail": "Deploying frontend to staging Cloud Run..." } } }' || true

      # ── FIX D: tolerate skipped backend deploy ──────────────────────────
      # THE BUG: on a frontend-only push, deploy_staging (backend) is
      # skipped because image_changed == 'false'. The old condition required
      # steps.deploy_staging.outcome == 'success', which excluded 'skipped',
      # so deploy_frontend_staging never ran and the dashboard row hung at
      # "deploy_staging: RUNNING" forever.
      # THE FIX: use != 'failure' so a skipped (or successful) backend deploy
      # still allows the frontend deploy to proceed.
      - name: Deploy Frontend to Staging Cloud Run
        id: deploy_frontend_staging
        if: >
          steps.changes.outputs.frontend_changed == 'true' &&
          steps.deploy_staging.outcome != 'failure'
        run: |
          gcloud run deploy secureflow-frontend-staging \
            --image us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/frontend:${{ github.sha }} \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080

      - name: Notify Staging Deploy Complete
        if: steps.deploy_staging.outcome == 'success' || steps.deploy_frontend_staging.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "deploy_staging": { "result": "PASS", "detail": "Staging Cloud Run deployment completed" } } }' || true

      - name: Build DAST Target URL
        id: dast_target
        if: steps.deploy_staging.outcome == 'success' || steps.deploy_frontend_staging.outcome == 'success'
        env:
          STAGING_URL: ${{ steps.staging_url.outputs.staging_url }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            DAST_TARGET="$STAGING_URL"
            echo "dast_target=$DAST_TARGET" >> "$GITHUB_OUTPUT"
            echo "DAST target URL from staging deploy: $DAST_TARGET"
          else
            echo "Backend staging deploy was skipped — querying GCP for active secureflow-backend-staging URL..."
            DAST_TARGET=$(gcloud run services describe secureflow-backend-staging --region us-central1 --format 'value(status.url)' 2>/dev/null || echo "")
            if [ -n "$DAST_TARGET" ]; then
              echo "dast_target=$DAST_TARGET" >> "$GITHUB_OUTPUT"
              echo "Resolved DAST target URL from GCP: $DAST_TARGET"
            else
              echo "::error::Staging URL is empty — cannot build valid DAST target endpoint."
              exit 1
            fi
          fi

      # ── Step 16b: Trigger Distributed DAST Pipeline ─────────────────────────
      - name: Trigger Automated Distributed DAST Pipeline
        id: trigger_dast
        if: steps.deploy_staging.outcome == 'success' || steps.deploy_frontend_staging.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DAST_TARGET: ${{ steps.dast_target.outputs.dast_target }}
        run: |
          TARGET_URL="$DAST_TARGET"
          echo "Triggering backend DAST orchestration for staging target: $TARGET_URL..."

          RUN_ID_VAL="${RUN_ID:-null}"
          if [ "$RUN_ID_VAL" != "null" ] && [ -n "$RUN_ID_VAL" ]; then
            RUN_ID_JSON="\"$RUN_ID_VAL\""
          else
            RUN_ID_JSON="null"
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --arg target_url "$TARGET_URL" \
            --arg deployment_url "$TARGET_URL" \
            --arg environment "staging" \
            --argjson run_id "$RUN_ID_JSON" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, target_url: $target_url, deployment_url: $deployment_url,
              environment: $environment, run_id: $run_id
            }')

          # Retry up to 5 times to handle Cloud Run cold-start/deployment rollout latency
          RESPONSE=""
          DAST_RUN_ID=""
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: Posting to $BACKEND_URL/api/scan-results/start..."
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "$BACKEND_URL/api/scan-results/start" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            RESPONSE=$(cat response.json)
            if [[ $HTTP_CODE -ge 200 && $HTTP_CODE -lt 300 ]]; then
              DAST_RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id // empty')
              if [ -n "$DAST_RUN_ID" ] && [ "$DAST_RUN_ID" != "null" ]; then
                echo "DAST trigger successful on attempt $attempt! run_id=${DAST_RUN_ID}"
                break
              fi
            fi
            echo "Attempt $attempt failed (HTTP $HTTP_CODE, Response: $RESPONSE). Retrying in 5 seconds..."
            sleep 5
          done

          if [ -z "$DAST_RUN_ID" ] || [ "$DAST_RUN_ID" = "null" ]; then
            echo "WARNING: DAST trigger did not return a valid run_id after 5 attempts."
            echo "dast_run_id=${RUN_ID:-}" >> "$GITHUB_OUTPUT"
          else
            echo "dast_run_id=${DAST_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "DAST task dispatched for run_id=${DAST_RUN_ID}"
          fi

      # ── Step 17: ZAP Policy Gate — Poll DAST Results & Gate ──────────────────
      # Uses PATCH /api/scan-results/{run_id}/progress to poll DAST status.
      - name: ZAP Policy Gate — Poll DAST Results & Gate
        id: zap_gate
        if: steps.deploy_staging.outcome == 'success' || steps.deploy_frontend_staging.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          TRIGGER_RUN_ID: ${{ steps.trigger_dast.outputs.dast_run_id }}
          START_RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          POLL_INTERVAL=15
          MAX_RETRIES=40
          retry=0

          RUN_ID="${TRIGGER_RUN_ID:-$START_RUN_ID}"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: Cannot poll DAST progress — no valid run_id was provided!"
            echo "zap_passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Polling backend for DAST completion on run $RUN_ID..."
          echo "Endpoint: $BACKEND_URL/api/scan-results/$RUN_ID/progress"

          consecutive_404=0

          while [ $retry -lt $MAX_RETRIES ]; do
            RAW_RESP=$(curl -sS -X GET "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
              -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
              -H "Content-Type: application/json" 2>/dev/null || echo '')

            if echo "$RAW_RESP" | jq empty 2>/dev/null; then
              RESPONSE="$RAW_RESP"
            else
              RAW_PATCH=$(curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
                -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
                -H "Content-Type: application/json" \
                -d '{}' 2>/dev/null || echo '')
              if echo "$RAW_PATCH" | jq empty 2>/dev/null; then
                RESPONSE="$RAW_PATCH"
              else
                echo "Poll $((retry + 1))/$MAX_RETRIES — Server returned non-JSON response: $RAW_RESP"
                RESPONSE='{"dast_status":"running","pipeline_steps":{}}'
              fi
            fi

            IS_NOT_FOUND=$(echo "$RESPONSE" | jq -r '.detail // empty' 2>/dev/null || echo '')
            if [ "$IS_NOT_FOUND" = "Run not found" ] || [ "$IS_NOT_FOUND" = "Not Found" ]; then
              consecutive_404=$((consecutive_404 + 1))
              echo "Poll $((retry + 1))/$MAX_RETRIES — Run $RUN_ID not found on backend (404 count: $consecutive_404/3)"
              if [ $consecutive_404 -ge 3 ]; then
                echo "ERROR: Scan run_id=$RUN_ID does not exist on backend after 3 checks."
                echo "zap_passed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            else
              consecutive_404=0
            fi

            DAST_STATUS=$(echo "$RESPONSE" | jq -r '.dast_status // "running"' 2>/dev/null || echo "running")
            ZAP_RESULT=$(echo "$RESPONSE" | jq -r '.pipeline_steps.zap.result // "PENDING"' 2>/dev/null || echo "PENDING")

            echo "Poll $((retry + 1))/$MAX_RETRIES — dast_status=$DAST_STATUS  zap.result=$ZAP_RESULT"

            if [ "$DAST_STATUS" = "completed" ] || [ "$DAST_STATUS" = "passed" ] || [ "$ZAP_RESULT" = "PASS" ]; then
              echo "DAST completed."
              if [ "$ZAP_RESULT" = "PASS" ] || [ "$DAST_STATUS" = "completed" ] || [ "$DAST_STATUS" = "passed" ]; then
                echo "ZAP DAST passed — proceeding to production deploy."
                echo "zap_passed=true" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "ZAP DAST FAILED (result=$ZAP_RESULT) — blocking production deploy."
                curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
                  -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
                  -H "Content-Type: application/json" \
                  -d '{ "status": "complete", "pipeline_steps": { "zap": { "result": "BLOCK", "detail": "ZAP DAST failed on staging — production deploy blocked" } } }' || true
                echo "zap_passed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            if [ "$DAST_STATUS" = "failed" ] || [ "$DAST_STATUS" = "queue_failed" ]; then
              echo "DAST failed (status=$DAST_STATUS) — blocking production deploy."
              curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
                -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
                -H "Content-Type: application/json" \
                -d '{ "status": "complete", "pipeline_steps": { "zap": { "result": "BLOCK", "detail": "DAST scan failed on staging — production deploy blocked" } } }' || true
              echo "zap_passed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "DAST still running (status=$DAST_STATUS) — waiting ${POLL_INTERVAL}s..."
            sleep $POLL_INTERVAL
            retry=$((retry + 1))
          done

          echo "Timeout waiting for DAST to complete after $((MAX_RETRIES * POLL_INTERVAL))s."
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "complete", "pipeline_steps": { "zap": { "result": "BLOCK", "detail": "DAST timed out — production deploy blocked" } } }' || true
          echo "zap_passed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # ── Step 18: Deploy to PRODUCTION ──────────────────────────────────────
      - name: Notify Production Deploy
        if: steps.zap_gate.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "pipeline_steps": { "deploy_prod": { "result": "RUNNING", "detail": "Deploying to production Cloud Run..." } } }' || true

      - name: Deploy Backend to Production Cloud Run
        if: steps.changes.outputs.image_changed == 'true' && steps.zap_gate.outcome == 'success'
        run: |
          gcloud run deploy secureflow-backend \
            --image us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }} \
            --region us-central1 \
            --set-secrets="GROQ_API_KEY=GROQ_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --allow-unauthenticated

      - name: Deploy Frontend to Production Cloud Run
        if: >
          steps.changes.outputs.frontend_changed == 'true' &&
          steps.zap_gate.outcome == 'success'
        run: |
          gcloud run deploy secureflow-frontend \
            --image us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/frontend:${{ github.sha }} \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080

      - name: Notify Production Deploy Success
        if: steps.zap_gate.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "complete", "pipeline_steps": { "deploy_prod": { "result": "PASS", "detail": "Production Cloud Run deployment finished successfully" } } }' || true

      - name: Notify Production Deploy Failure
        if: failure() && steps.zap_gate.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
        run: |
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "complete", "pipeline_steps": { "deploy_prod": { "result": "FAILED", "detail": "Production gcloud run deploy command failed" } } }' || true

      - name: Deploy Summary
        if: always() && steps.changes.outcome == 'success'
        run: |
          echo "=== Deploy summary ==="
          echo "backend_changed (image):  ${{ steps.changes.outputs.image_changed }}"
          echo "frontend_changed:         ${{ steps.changes.outputs.frontend_changed }}"
          if [ "${{ steps.changes.outputs.image_changed }}" != "true" ] && [ "${{ steps.changes.outputs.frontend_changed }}" != "true" ]; then
            echo ""
            echo "::notice title=No deploy ran::This push had no backend/ or frontend/ file changes (CI-only commits skip deploy)."
            echo "Fix: push with [deploy] in the commit message, or Actions → Run workflow → enable deploy_backend + deploy_frontend."
          fi

      # ── Failsafe: catch anything still unreported ──
      # *** FIX C ***
      # THE BUG: every notify-failure step in this workflow is conditioned on
      # a SPECIFIC prior step's outcome (gitleaks, semgrep, docker_build,
      # docker_push, gate, deploy). That leaves gaps: a step failing for a
      # reason NONE of those conditions anticipate (checkout itself failing,
      # the runner getting OOM-killed, a YAML/permissions error, the
      # concurrency cancellation from Fix A, an unhandled exit in any step
      # without continue-on-error) falls through every single guard and the
      # job just ends — dashboard row stuck at "running" forever, exactly
      # like the 9 runs in the screenshot.
      #
      # THE FIX: one final step, gated only on `always()` and on the run_id
      # existing, that checks whether the job's overall conclusion was not
      # successful AND nothing has reported back yet. It can't know exactly
      # which step died, but it guarantees the dashboard row gets *closed*
      # instead of hanging — converting "stuck forever" into "reported as
      # failed, with a generic but honest reason." Combined with the
      # backend's stale-run watchdog, no run should ever again sit at
      # "running" past a couple of minutes without an explanation.
      - name: Failsafe — Notify Unhandled Pipeline Failure
        if: always() && failure() && steps.pipeline_start.outputs.run_id != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_API_SECRET: ${{ secrets.BACKEND_API_SECRET }}
          RUN_ID: ${{ steps.pipeline_start.outputs.run_id }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg scan_type "full-pipeline" \
            --arg severity "UNKNOWN" \
            --arg action "BLOCK" \
            --arg reason "Pipeline job failed or was cancelled at an unreported step — check GitHub Actions run logs for this commit" \
            --argjson run_id "\"${RUN_ID}\"" \
            '{
              repo_name: $repo, commit_sha: $sha, branch: $branch, commit_message: $commit_msg,
              scan_type: $scan_type, severity: $severity, action: $action, reason: $reason,
              run_id: $run_id, findings: {},
              pipeline_steps: {
                checkout:       { result: "PASS",    detail: "code checked out" },
                code_scan:      { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                docker:         { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                trivy:          { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                policy:         { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                deploy_staging: { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                zap:            { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                zap_gate:       { result: "SKIPPED", detail: "pipeline cancelled before completion" },
                deploy_prod:    { result: "SKIPPED", detail: "pipeline cancelled before completion" }
              }
            }')
          curl -sS -X POST "$BACKEND_URL/api/scan-results" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" -d "$PAYLOAD" || true
          curl -sS -X PATCH "$BACKEND_URL/api/scan-results/$RUN_ID/progress" \
            -H "Authorization: Bearer ${BACKEND_API_SECRET:-}" \
            -H "Content-Type: application/json" \
            -d '{ "status": "complete" }' || true

