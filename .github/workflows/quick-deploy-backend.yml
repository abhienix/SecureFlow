# ─────────────────────────────────────────────────────────────────────────────
# Quick Deploy — Backend Only
#
# Builds and pushes the backend Docker image, then deploys it to BOTH
# secureflow-backend (prod) and secureflow-backend-staging Cloud Run
# services. Skips ALL security scans.
#
# Trigger:
#   - Manually from GitHub Actions → "Run workflow"
#   - OR push to a branch named  deploy/backend-*
# ─────────────────────────────────────────────────────────────────────────────
name: "⚡ Quick Deploy — Backend"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - prod-only
          - staging-only
  push:
    branches:
      - "deploy/backend-*"

concurrency:
  group: quick-deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: "⚡ Build & Deploy Backend"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # nosemgrep

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2 # nosemgrep
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2 # nosemgrep

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Backend Image
        run: |
          IMAGE="us-central1-docker.pkg.dev/secureflow-499814/secureflow-repo/backend:${{ github.sha }}"
          docker build -f ./backend/Dockerfile \
            -t "$IMAGE" \
            ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Staging
        if: inputs.target != 'prod-only'
        run: |
          gcloud run deploy secureflow-backend-staging \
            --image "$IMAGE" \
            --region us-central1 \
            # nosemgrep

            --set-secrets="GROQ_API_KEY=GROQ_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --allow-unauthenticated

      - name: Deploy to Production
        if: inputs.target != 'staging-only'
        run: |
          gcloud run deploy secureflow-backend \
            --image "$IMAGE" \
            --region us-central1 \
            --set-secrets="GROQ_API_KEY=GROQ_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --allow-unauthenticated

      - name: Summary
        run: |
          echo "### ⚡ Backend Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.target || 'both' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
