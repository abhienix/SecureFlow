# SecureFlow — Gitleaks config
# Scans run in CI with --log-opts (push delta only). This file excludes
# known false-positive paths and report artifacts.

title = "SecureFlow Gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Ignore scan report artifacts, local env files, and known service tokens"
regexes = [
  '''bf84de64b1d98b7768be582e888003c47f3fc11da134f598be04cdcb5f4dc8a2''',
]
paths = [
  '''(?i)(^|/)report\.json$''',
  '''(?i)(^|/)gitleaks-full\.json$''',
  '''(?i)(^|/)leaks-report\.json$''',
  '''(?i)(^|/)gitleaks-results\.json$''',
  '''(?i)(^|/)\.env(\..*)?$''',
  '''(?i)(^|/)node_modules/''',
]
