services:
  secureflow-ollama:
    image: ollama/ollama:latest
    container_name: secureflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  secureflow-ollama-init:
    image: ollama/ollama:latest
    container_name: secureflow-ollama-init
    depends_on:
      secureflow-ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://secureflow-ollama:11434
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo 'Ollama is ready. Checking models...';
      ollama pull qwen2.5:3b || echo 'qwen2.5:3b already up to date';
      ollama pull deepseek-coder:6.7b || echo 'deepseek-coder already up to date';
      ollama pull nomic-embed-text || echo 'nomic-embed-text already up to date';
      echo 'Model initialization complete!';
      "

  secureflow-ai-server:
    build: .
    container_name: secureflow-ai-server
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://secureflow-ollama:11434
    volumes:
      - chroma-data:/data/chromadb
    depends_on:
      secureflow-ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  secureflow-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: secureflow-tunnel
    command: tunnel --no-autoupdate run --token eyJhIjoiYjA2MjEwZjI2YTU5NDU5NjI2MzlkNzAwNTg3MDI0ODQiLCJ0IjoiYWUzYzE4ODEtNzllMy00YjdhLTk5MTAtYTlmNzc0M2UxYWQ5IiwicyI6IlpqWmlNMlJtTWpBdE16UXpZUzAwWWpFNExXSTVaR1V0Tm1KbFpqbGlaRE15WldKbSJ9
    network_mode: host
    depends_on:
      secureflow-ai-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:
  chroma-data:
